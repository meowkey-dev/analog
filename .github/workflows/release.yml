name: release

# Tag -> a GitHub release with one archive per platform.
#
# Each archive holds `analog`, `analog-server` and `analog-mcp`, and the server
# carries the built SPA inside it. There is nothing to install and no runtime to
# match: unpack it and run it.
#
#   curl -fsSL https://raw.githubusercontent.com/meowkey-dev/analog/main/scripts/install.sh | sh
# or, unpacked by hand:
#   curl -L https://github.com/meowkey-dev/analog/releases/latest/download/analog-darwin-arm64.tar.gz | tar xz
#   ./analog-server
#
# CGO is off, so every target cross-compiles from one Linux runner —
# modernc.org/sqlite is pure Go and drags no C toolchain into the build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Checked in the tap-bump step's `if`; empty when the secret is absent.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Build the web bundle
        working-directory: web
        run: npm ci && npm run build

      - name: Build the matrix
        run: |
          scripts/build.sh \
            darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64

      # A binary that needs a repo beside it is not a binary you can ship, and the
      # size is a stated goal rather than an accident. Both are checked here so a
      # regression fails the release instead of reaching a user.
      - name: Prove the server stands alone, and is small
        run: |
          set -euo pipefail
          for dir in bin/*/; do
            size=$(du -m "$dir/analog-server"* | cut -f1)
            echo "$dir  ${size}MB"
            [ "$size" -lt 20 ] || { echo "analog-server is ${size}MB, over the 20MB budget"; exit 1; }
          done

          # Run it from an empty directory with no checkout in sight.
          workdir=$(mktemp -d)
          cp bin/linux-amd64/analog-server "$workdir/"
          (cd "$workdir" && ./analog-server --port 8788 &)
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:8788/api/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          trap 'pkill -f "analog-server --port 8788" || true' EXIT

          curl -fsS http://127.0.0.1:8788/api/health | tee /dev/stderr | grep -q '"ok":true'
          # ...and it serves the UI, not just the API.
          curl -fsS http://127.0.0.1:8788/ | grep -qi '<!doctype html' \
            || { echo "the web bundle is not embedded"; exit 1; }
          # It made its own data directory rather than needing one.
          test -f "$workdir/data/analog.db" || { echo "no data/ was created"; exit 1; }

      - name: Run the conformance suite against what is being released
        run: |
          uv venv --python 3.13
          uv pip install -r tests/requirements.txt
          ANALOG_SERVER_BIN="$PWD/bin/linux-amd64/analog-server" \
            .venv/bin/python -m pytest -q

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in bin/*/; do
            platform=$(basename "$dir")
            case "$platform" in
              # Unversioned on purpose: /releases/latest/download/<name> resolves
              # only an exact asset name. The installer (scripts/install.sh) and
              # the manual install line in README.md both rely on that, and the
              # installer fetches SHA256SUMS the same way.
              windows-*) (cd "$dir" && zip -q -r "../../dist/analog-${platform}.zip" .) ;;
              *)         tar -czf "dist/analog-${platform}.tar.gz" -C "$dir" . ;;
            esac
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release upload does not create a missing release — v0.4.1's
          # first run failed on exactly that. Create the shell of it (the
          # notes are still written by hand), then upload.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      # Keep `brew install meowkey-dev/tap/analog` on this release. Needs a PAT
      # with contents:write on meowkey-dev/homebrew-tap; without the secret the
      # step is skipped and scripts/bump-tap.sh is the manual fallback.
      - name: Update the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/') && env.TAP_TOKEN != ''
        run: scripts/bump-tap.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
