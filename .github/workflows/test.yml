name: test

# The contract suite is the point: tests/contract/ is written against contracts/
# and SPEC.md rather than against the implementation, and it reaches the server over
# HTTP like any other client. A red build there means the server stopped describing
# the contract, not that a refactor moved a symbol.
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -race

  conformance:
    name: conformance (${{ matrix.os }})
    # Two platforms because the server is shipped as a binary now: the suite has to
    # judge the thing that gets released, not one build of it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Build the binaries
        run: scripts/build.sh

      - name: Install the harness
        run: |
          uv venv --python 3.13
          uv pip install -r tests/requirements.txt

      - name: Run the contract suite against the binary
        run: .venv/bin/python -m pytest -q

  web:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: tsc --noEmit && vite build
        working-directory: web
        run: npm run build
