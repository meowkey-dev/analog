name: test

# The conformance suite is the point: tests/ is written against contracts/ and
# SPEC.md rather than against the implementation, and it reaches the server over
# HTTP like any other client. A red build there means the server stopped describing
# the contract, not that a refactor moved a symbol.
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -race

  conformance:
    name: conformance (${{ matrix.os }})
    # Two platforms because the server is shipped as a binary now: the suite has to
    # judge the thing that gets released, not one build of it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        run: scripts/build.sh

      # The suite is a separate module so the implementation is unimportable from
      # it; that also keeps it out of the root module's `go test ./...`, so it runs
      # here, against the binary that was just built.
      - name: Run the conformance suite against the binary
        working-directory: tests
        run: |
          go vet ./...
          go test -count=1 ./...

  web:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: tsc --noEmit && vite build
        working-directory: web
        run: npm run build

      - name: Web unit tests
        working-directory: web
        run: npm test
