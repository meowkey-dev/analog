name: test

# The contract suite is the point: tests/contract/ is written against contracts/
# and SPEC.md rather than against the implementation, so a red build here means
# the server stopped describing the contract, not that a refactor moved a symbol.
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # Both ends of the range pyproject claims, so `requires-python = ">=3.11"` is
    # a tested statement rather than an aspiration.
    name: suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv, not --system: Ubuntu's system Python is externally managed, and a
      # venv is how the repo is actually used anyway.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,mcp]"

      - name: Run the suite
        run: .venv/bin/python -m pytest -q

  web:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: tsc --noEmit && vite build
        working-directory: web
        run: npm run build
