# `cc` on this machine's PATH is a shim that execs `claude` (~/bin/cc, "cc" as in
# Claude Code), so it shadows /usr/bin/cc. rustc drives the linker by calling `cc`,
# which means every link fails with `unknown option '-lSystem'` until it is told
# where the real compiler is.
#
# Scoped per target so a Linux or Windows build of this same crate is untouched, and
# kept in the repo rather than fixed on the machine — nobody should have to un-alias
# a shortcut they chose in order to build this.
[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[target.x86_64-apple-darwin]
linker = "/usr/bin/cc"

# cc-rs build scripts (objc2-exception-helper and friends) shell out to `cc` as a
# compiler, not just as a linker driver, so they need the same redirect. These keys
# are target-scoped — cc-rs looks up CC_<target> first — which keeps a Linux or
# Windows build of this crate on its own default compiler.
[env]
CC_aarch64-apple-darwin = "/usr/bin/cc"
CC_x86_64-apple-darwin = "/usr/bin/cc"
CXX_aarch64-apple-darwin = "/usr/bin/c++"
CXX_x86_64-apple-darwin = "/usr/bin/c++"
