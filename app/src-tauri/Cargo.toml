[package]
name = "analog-app"
version = "0.1.0"
description = "A shared canvas for one human and their agents"
edition = "2021"
rust-version = "1.77"

[lib]
name = "analog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
